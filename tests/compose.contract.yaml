# Use only with project name mg-ai-contract; never with a provider-enabled stack.
services:
  gateway:
    ports: !override
      - "127.0.0.1:18088:8080"
    environment:
      MG_CONFIG_ROOT: /contract
      MOCK_PROVIDER_KEY: synthetic-test-key
    volumes:
      - ./.runtime/contract:/contract:ro
  proxy:
    environment:
      MOCK_PROVIDER_KEY: synthetic-test-key
    volumes: !override
      - ./.runtime/contract/litellm.yaml:/app/config.yaml:ro
    depends_on:
      - mock
  mock:
    image: maghsoud-ai-infrastructure-gateway:0.1.0
    command: [python, /mock/provider.py]
    volumes:
      - ./tests/mock_provider.py:/mock/provider.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
